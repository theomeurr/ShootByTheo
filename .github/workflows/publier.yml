name: Publier sur OVH

# Chaque fois que le contenu du site change sur « main », le dossier public est
# régénéré puis déposé chez OVH par FTPS. Le déclenchement manuel est possible
# depuis l'onglet Actions (bouton « Run workflow »).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '*.command'
      - 'admin/interface.html'
      - 'admin/serveur.py'
  workflow_dispatch:

# Deux dépôts FTP simultanés laisseraient le site à moitié mis à jour.
concurrency:
  group: publier-ovh
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pillow réduit les photos en vignettes pour la mosaïque. Sans lui, la
      # publication réussit quand même mais sert les originaux : les pages
      # galerie repassent de 0,6 à 2,6 Mo.
      - name: Installer Pillow
        run: python3 -m pip install --quiet --disable-pip-version-check Pillow

      - name: Générer le dossier public
        run: python3 admin/publier.py _site

      - name: Vérifier avant de déposer
        # Un site incomplet mis en ligne est pire qu'un déploiement échoué :
        # on s'arrête ici plutôt que d'écraser la version en place.
        run: |
          set -e
          for f in _site/index.html _site/data.js _site/robots.txt _site/.htaccess; do
            test -s "$f" || { echo "::error::$f manquant ou vide"; exit 1; }
          done
          if ! test -s _site/sitemap.xml; then
            echo "::error::sitemap.xml absent — l'adresse du site n'est pas renseignée dans data.js (site.domaine)."
            exit 1
          fi
          pages=$(find _site -name index.html | wc -l)
          images=$(find _site/image -type f | wc -l)
          vignettes=$(find _site/image -type d -name vignettes -exec find {} -type f \; | wc -l)
          echo "$pages page(s), $images image(s) dont $vignettes vignette(s), $(du -sh _site | cut -f1)"
          if [ "$vignettes" -eq 0 ]; then
            echo "::warning::aucune vignette produite — les galeries seront servies en pleine taille"
          fi
          test "$pages" -ge 5 || { echo "::error::trop peu de pages générées ($pages)"; exit 1; }
          test "$images" -ge 10 || { echo "::error::trop peu d'images ($images)"; exit 1; }

      # Le fichier de configuration de l'administration en ligne contient
      # l'empreinte du mot de passe et le jeton GitHub. Il n'est pas dans le
      # dépôt : il est écrit ici, et déposé à l'étape suivante à côté du
      # dossier web plutôt que dedans, hors de portée d'Apache.
      - name: Préparer la configuration de l'administration
        id: admin
        env:
          MDP_HASH: ${{ secrets.ADMIN_MDP_HASH }}
          JETON: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: |
          set -e
          # Seul le jeton est indispensable : c'est une clé que personne d'autre
          # ne peut créer. Le mot de passe, lui, se choisit à la première visite
          # de /admin/ — le secret ADMIN_MDP_HASH reste possible mais facultatif.
          if [ -z "$JETON" ]; then
            echo "jeton GitHub absent — l'administration en ligne ne sera pas déposée"
            rm -rf _site/admin
            echo "config=non" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$MDP_HASH" ]; then
            echo "mot de passe à choisir à la première visite de /admin/"
          fi
          # Les valeurs sont encodées avant d'être écrites : un hash bcrypt ou
          # un jeton contient $, / et parfois une apostrophe, qu'il faudrait
          # sinon échapper à travers le shell puis PHP. En base64, la question
          # ne se pose plus — l'alphabet est sans caractère spécial.
          {
            printf '%s\n' '<?php return ['
            printf "  'mdp_hash' => base64_decode('%s'),\n"     "$(printf '%s' "$MDP_HASH" | base64 -w0)"
            printf "  'github_token' => base64_decode('%s'),\n" "$(printf '%s' "$JETON"    | base64 -w0)"
            printf "  'depot' => '%s',\n"   "$GITHUB_REPOSITORY"
            printf "  'branche' => '%s',\n" "$GITHUB_REF_NAME"
            printf '%s\n' '];'
          } > sbt-config.php
          php -l sbt-config.php >/dev/null 2>&1 || echo "::warning::php absent, syntaxe non vérifiée"
          echo "config=oui" >> "$GITHUB_OUTPUT"

      # L'hébergement mutualisé OVH ne gère pas le FTPS : il répond
      # « 500 This security scheme is not implemented » à AUTH TLS. Le dépôt
      # passe donc par SFTP, qui chiffre aussi bien la connexion.
      # Si l'offre souscrite n'ouvre pas le SSH, basculez la variable
      # OVH_PROTOCOLE sur « ftp » — au prix d'identifiants circulant en clair.
      - name: Déposer chez OVH
        env:
          SERVEUR: ${{ secrets.OVH_FTP_SERVER }}
          UTILISATEUR: ${{ secrets.OVH_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
          PROTOCOLE: ${{ vars.OVH_PROTOCOLE || 'sftp' }}
          # Chemin relatif au dossier de connexion. En SFTP, « /www » désigne
          # la racine du serveur, où ce dossier n'existe pas ; « www » vise
          # bien le dossier web, et reste valable en FTP.
          CIBLE: ${{ vars.OVH_FTP_DIR || 'www/' }}
          CONFIG: ${{ steps.admin.outputs.config }}
        run: |
          set -e
          test -n "$SERVEUR" || { echo "::error::le secret OVH_FTP_SERVER est vide"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Le fichier de configuration monte à la racine de connexion, un
          # cran au-dessus du dossier web : Apache ne peut donc pas le servir.
          depot_config=''
          if [ "$CONFIG" = "oui" ]; then
            depot_config='put -O . sbt-config.php'
          fi
          # --env-password : le mot de passe ne passe ni par la ligne de
          # commande ni par le script, donc jamais par la liste des processus.
          lftp --env-password -u "$UTILISATEUR" "$PROTOCOLE://$SERVEUR" <<LFTP
            set cmd:fail-exit yes
            set sftp:auto-confirm yes
            set net:max-retries 3
            set net:timeout 20
            set ftp:ssl-allow no
            # Sans --delete : rien n'est retiré du serveur sans intervention.
            mirror --reverse --continue --verbose --parallel=4 _site/ "$CIBLE"
            $depot_config
            bye
          LFTP
          rm -f sbt-config.php
