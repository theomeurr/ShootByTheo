<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - SHOOTBYTHEO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SHOOTBYTHEO</h1>
        <nav>
            <ul>
                <li><a href="index.html">À la une</a></li>
                <li><a href="travail.html">Travail</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contact-container">
            
            <div class="contact-form">
                <form action="https://formspree.io/f/xpznqkgb" method="POST">
                    <input type="text" name="nom" placeholder="Nom" required>
                    <input type="email" name="email" placeholder="Adresse e-mail" required>
                    <input type="text" name="instagram" placeholder="Votre Instagram">
                    <textarea name="message" placeholder="Message" rows="6" required></textarea>
                    <input type="text" name="ville" placeholder="Ville">
                    <button type="submit">Envoyer</button>
                </form>
                <p style="margin-top: 15px; font-size: 12px; color: #aaaaaa; text-align: center;">
                    Les messages sont envoyés à contact@shootbytheo.com
                </p>
            </div>

            <div class="contact-info">
                <p>N'hésitez pas à me contacter pour toute demande de prestation, collaboration ou simplement pour échanger.</p>
                <p>Vous pouvez également me suivre sur mes réseaux sociaux :</p>
                <p>
                    <a href="#" style="color:#ffffff; text-decoration:none;">Instagram</a> | 
                    <a href="#" style="color:#ffffff; text-decoration:none;">Flickr</a>
                </p>
            </div>

        </div>
    </main>

</body>
</html>
