<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — SHOOTBYTHEO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0b0a; --panel:#151311; --panel2:#1c1917; --ink:#f2efe9; --accent:#e2543a;
  --muted:#948d83; --line:rgba(242,239,233,.13);
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
/* Les règles d'affichage ci-dessous (.b, .choix…) l'emportent sur le
   display:none que le navigateur applique à [hidden] : sans cela, un
   élément masqué reste visible et cliquable. */
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
::selection{background:var(--accent);color:var(--bg)}
button{font-family:inherit}

header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px 16px;
  flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(12,11,10,.97)}
.marque{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.marque span{color:var(--accent)}
#etat{margin-left:auto;font-size:13px;color:var(--muted);min-width:0}
#etat.ok{color:#7fbf7f}
#etat.ko{color:var(--accent)}

.app{display:grid;grid-template-columns:274px 1fr;min-height:calc(100vh - 57px)}
.side{border-right:1px solid var(--line);padding:16px 14px;background:var(--panel)}
.side h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  margin:22px 8px 10px;font-weight:600}
.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:none;border:none;color:var(--ink);padding:9px 10px;border-radius:8px;font-size:14px}
.nav:hover{background:var(--panel2)}
.nav.on{background:var(--accent);color:var(--bg);font-weight:700}
.nav .vign{width:44px;height:30px;border-radius:4px;flex:none;background:#000 center/cover;border:1px solid var(--line)}
.nav .nb{margin-left:auto;font-family:var(--mono);font-size:11px;opacity:.75}
.nav-ico{width:44px;text-align:center;font-size:18px;flex:none}
main{padding:26px 34px 90px;max-width:980px}

h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.01em}
.fil{font-size:13px;color:var(--muted);margin:0 0 10px}
.fil button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:0}
.fil button:hover{text-decoration:underline}
.sous{margin:0 0 24px;color:var(--muted);font-size:14px;line-height:1.6;max-width:66ch}
.bloc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.bloc h3{margin:0 0 4px;font-size:16px;font-weight:700}
.bloc .aide{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.55}

label.f{display:block;font-size:12px;font-weight:600;margin:14px 0 3px}
label.f i{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
input[type=text],input[type=password],input[type=date],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);
  color:var(--ink);padding:10px 12px;font-size:14px;font-family:inherit;border-radius:7px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:64px;line-height:1.55}
input[type=range]{width:100%;accent-color:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media (max-width:880px){.duo{grid-template-columns:1fr}}

.b{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:7px;cursor:pointer;
  padding:10px 15px;font-size:13px;font-weight:600;background:var(--accent);color:var(--bg);
  text-decoration:none}
.b:hover{filter:brightness(1.09)}
.b.s{background:none;border:1px solid var(--line);color:var(--ink)}
.b.s:hover{border-color:rgba(242,239,233,.45);filter:none;background:var(--panel2)}
.b.d{background:none;border:1px solid rgba(226,84,58,.45);color:var(--accent)}
.b.p{padding:7px 11px;font-size:12px}
.b[disabled]{opacity:.35;cursor:default;filter:none}
.liv-item{display:block;width:100%;text-align:left;margin-bottom:8px}
.liv-liste{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.liv-liste li{font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
.liv-liste li:last-child{border-bottom:none}
.barre{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pousse{margin-left:auto}

.diapo{position:relative;aspect-ratio:16/7;border-radius:10px;overflow:hidden;background:#000 center/cover;border:1px solid var(--line)}
.diapo .voile{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(12,11,10,.35),transparent 30%,rgba(12,11,10,.55) 70%,rgba(12,11,10,.95))}
.diapo .txt{position:absolute;left:0;right:0;bottom:0;padding:0 24px 20px}
.diapo .k{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:7px;text-shadow:0 1px 10px rgba(0,0,0,.9)}
.diapo .t{font-weight:900;font-size:clamp(24px,4vw,50px);line-height:.85;text-transform:uppercase;letter-spacing:-.02em;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.diapo .m{font-size:12px;color:rgba(242,239,233,.86);margin-top:8px;text-shadow:0 1px 10px rgba(0,0,0,.8)}
.diapo .outils{position:absolute;top:12px;right:12px;display:flex;gap:7px;opacity:0;transition:opacity .18s}
.diapo:hover .outils{opacity:1}
.diapo .outils .b{background:rgba(12,11,10,.82);color:var(--ink);backdrop-filter:blur(4px)}
.diapo .outils .b:hover{background:var(--accent);color:var(--bg)}
.vide{aspect-ratio:16/7;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}

.zone{border:1px dashed var(--line);border-radius:10px;padding:20px;text-align:center;margin-top:14px}
.zone.survol{border-color:var(--accent);background:rgba(226,84,58,.07)}
.zone p{margin:0 0 12px;color:var(--muted);font-size:13px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:16px}
.ph{position:relative;border-radius:9px;overflow:hidden;background:#100e0d;border:1px solid var(--line)}
.ph .im{cursor:grab;position:relative}
.ph.glisse{opacity:.35}
.ph.cible{border-color:var(--accent);box-shadow:0 0 0 2px rgba(226,84,58,.4)}
.ph img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.ph .outils{position:absolute;top:8px;right:8px;display:flex;gap:6px;opacity:0;transition:opacity .18s}
.ph:hover .outils{opacity:1}
.ph .outils .b{background:rgba(12,11,10,.85);color:var(--ink);padding:6px 9px;font-size:11px}
.ph .outils .b:hover{background:var(--accent);color:var(--bg)}
.ph .bas{padding:9px;display:flex;flex-direction:column;gap:7px}
.ph .bas input,.ph .bas select{padding:7px 9px;font-size:12.5px}
.badge{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--bg);
  font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:100px}
.rang{position:absolute;bottom:8px;left:8px;background:rgba(12,11,10,.8);color:var(--ink);
  font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:4px}

.journees{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:14px}
.jr{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#100e0d;
  cursor:pointer;padding:0;text-align:left;color:inherit;font:inherit;display:block;width:100%}
.jr:hover{border-color:var(--accent)}
.jr img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;filter:brightness(.62)}
.jr .txt{padding:13px 14px}
.jr .d{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.jr .t{font-weight:800;font-size:16px;margin:5px 0 4px;line-height:1.2}
.jr .n{font-size:12px;color:var(--muted)}
.jr .ordre{position:absolute;top:8px;right:8px;display:flex;gap:5px;opacity:0;transition:opacity .18s}
.jr:hover .ordre{opacity:1}
.jr .ordre span{background:rgba(12,11,10,.85);border:1px solid var(--line);border-radius:5px;
  padding:4px 7px;font-size:11px;color:var(--ink)}
.jr .ordre span:hover{background:var(--accent);color:var(--bg)}
/* Sans couverture, mieux vaut un vide assumé que le logo du site étiré. */
.jr .sans-img{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--muted);letter-spacing:.06em;
  background:repeating-linear-gradient(-45deg,#171513,#171513 10px,#141210 10px,#141210 20px)}

.bascule{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;margin-top:12px}
.bascule input{accent-color:var(--accent);width:17px;height:17px}
details.avance{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.avance summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none}
details.avance summary::-webkit-details-marker{display:none}
details.avance summary:before{content:'▸ ';color:var(--accent)}
details.avance[open] summary:before{content:'▾ '}
.choix{position:fixed;inset:0;z-index:50;background:rgba(8,7,7,.9);display:flex;align-items:center;justify-content:center;padding:26px}
.choix[hidden]{display:none}
.choix .boite{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:960px;width:100%;max-height:86vh;overflow:auto}
.choix .grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 9px}
.choix .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.choix .g button{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:#000}
.choix .g button:hover{border-color:var(--accent)}
.choix .g img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.offreEd{border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:10px}
@media (max-width:780px){
  .app{grid-template-columns:1fr}
  .side{border-right:none;border-bottom:1px solid var(--line)}
  main{padding:18px 16px 70px}
}
</style>
</head>
<body>

<header>
  <span class="marque">SHOOTBYTHEO <span>· Administration</span></span>
  <a class="b s" id="voir" href="/" target="_blank">Voir le site ↗</a>
  <button class="b" id="publier" hidden>Publier en ligne ↑</button>
  <span id="etat">Chargement…</span>
</header>

<div class="app">
  <aside class="side">
    <button class="nav" id="navEvts"><span class="nav-ico">📅</span> Événements</button>
    <button class="nav" id="navUne"><span class="nav-ico">★</span> À la une</button>
    <h2>Le site</h2>
    <button class="nav" id="navApropos"><span class="nav-ico">👤</span> À propos</button>
    <button class="nav" id="navPresta"><span class="nav-ico">€</span> Prestations</button>
    <button class="nav" id="navReglages"><span class="nav-ico">⚙</span> Réglages</button>
    <button class="nav" id="navLivraisons"><span class="nav-ico">↓</span> Livraisons clients</button>
  </aside>
  <main id="vue"></main>
</div>

<div class="choix" id="choix" hidden>
  <div class="boite">
    <div class="barre" style="margin-bottom:6px">
      <h3 id="choixTitre" style="margin:0">Choisir une photo</h3>
      <button class="b s p pousse" id="choixFermer">Annuler</button>
    </div>
    <div id="choixCorps"></div>
  </div>
</div>

<script src="/admin/livraisons-interface.js"></script>
<script>
(function(){
'use strict';

let D = null, LIB = { accueil:[], web:[], apropos:[] }, vue = { type:'evts' }, minuteur = null;
const $ = s => document.querySelector(s);

/* ================= utilitaires ================= */
function el(tag, attrs = {}, ...kids){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)){
    if (v === undefined || v === false || v === null) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'style') n.style.cssText = v;
    else n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid) n.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  return n;
}
const nomFichier = s => (s || '').split('/').pop();

/* ---------- Adresse des points d'accès ----------
   L'administration locale (admin/serveur.py) répond sur /api/… ; celle en
   ligne (admin-web/api.php) sur api.php?r=… . Une seule interface, deux
   adresses : la page en ligne pose SBT_API et SBT_CSRF avant de la servir. */
const API_BASE = window.SBT_API || '/api/';
const EN_LIGNE = !!window.SBT_API;
function api(nom, params){
  let u = API_BASE + nom;
  if (params) u += (u.indexOf('?') > -1 ? '&' : '?') + params;
  return u;
}
function ecriture(opts){
  opts = Object.assign({ method:'POST' }, opts || {});
  if (window.SBT_CSRF) opts.headers = Object.assign({ 'X-CSRF': window.SBT_CSRF }, opts.headers || {});
  return opts;
}
/* Session close côté serveur : inutile de continuer à saisir dans le vide. */
function sessionPerdue(r){
  if (r && r.status === 401 && EN_LIGNE){
    alert('Votre session a expiré. Vous allez être invité à vous reconnecter.');
    location.reload();
    return true;
  }
  return false;
}
/* En ligne, une photo tout juste envoyée n'est pas encore sur le serveur :
   son adresse renverrait un cadre vide. github.js la garde en mémoire et la
   rend ici, le temps que la publication la mette en place. */
function srcPhoto(chemin){
  if (!chemin) return '';
  const attente = window.SBT_APERCU ? window.SBT_APERCU(chemin) : '';
  return attente || '/' + chemin;
}
const url = s => "url('" + (s.startsWith('data:') ? s : encodeURI(s)) + "')";
function slug(t){
  return String(t).normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase();
}
function etat(txt, cls){ const e = $('#etat'); e.textContent = txt; e.className = cls || ''; }
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function dateLisible(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? parseInt(m[3],10) + ' ' + MOIS[parseInt(m[2],10)-1] + ' ' + m[1] : '';
}

function champ(titre, aide, valeur, onChange, exemple, type){
  const i = el('input', { type: type || 'text', placeholder: exemple || '' });
  i.value = valeur || '';
  i.addEventListener('change', () => onChange(i.value));
  return el('div', {}, el('label', { class:'f' }, titre, aide ? el('i', { text:aide }) : null), i);
}
function zone(titre, aide, valeur, onChange, hauteur){
  const t = el('textarea');
  if (hauteur) t.style.minHeight = hauteur;
  t.value = valeur || '';
  t.addEventListener('change', () => onChange(t.value));
  return el('div', {}, el('label', { class:'f' }, titre, aide ? el('i', { text:aide }) : null), t);
}
function listeDer(titre, aide, options, valeur, onChange){
  const s = el('select');
  options.forEach(o => s.appendChild(el('option', { value:o.v, text:o.l })));
  s.value = valeur;
  s.addEventListener('change', () => onChange(s.value));
  return el('div', {}, el('label', { class:'f' }, titre, aide ? el('i', { text:aide }) : null), s);
}
function bascule(libelle, valeur, onChange){
  const c = el('input', { type:'checkbox' });
  c.checked = !!valeur;
  c.addEventListener('change', () => onChange(c.checked));
  return el('label', { class:'bascule' }, c, libelle);
}

/* ================= modèle ================= */
/* Un seul niveau : l'événement. Le sport n'est qu'une étiquette, pas un
   dossier à ouvrir. */
const evt = id => D.evenements.find(e => e.id === id);
const couvEvt = e => e && (e.cover || (e.photos[0] || {}).src || '');
const sportsConnus = () =>
  [...new Set(D.evenements.map(e => (e.sport || '').trim()).filter(Boolean))].sort();

function idLibre(base){
  let id = slug(base) || 'evenement', n = 2;
  while (evt(id)) id = (slug(base) || 'evenement') + '-' + (n++);
  return id;
}
function trierEvenements(){
  D.evenements.sort((a, b) => (b.date || '0000').localeCompare(a.date || '0000'));
}

/* ================= enregistrement ================= */
function enregistrer(){
  clearTimeout(minuteur);
  etat('Enregistrement…');
  minuteur = setTimeout(async () => {
    try {
      const r = await fetch(api('data'), ecriture({ body: JSON.stringify(D) }));
      if (sessionPerdue(r)) return;
      etat('Enregistré', 'ok');
      majGit();
    } catch (e) { etat('Non enregistré', 'ko'); }
  }, 400);
}
const maj = () => { enregistrer(); dessiner(); };

/* ================= publier en ligne =================
   Enregistrer écrit sur ce Mac ; publier envoie sur GitHub, qui met le
   site à jour. Le bouton reste caché si le dossier n'est pas relié à
   GitHub — l'administration s'utilise alors comme avant, avec Publier.command. */
let GIT = { actif:false };

async function majGit(){
  try { GIT = await (await fetch(api('git'))).json(); }
  catch (e) { GIT = { actif:false }; }
  const b = $('#publier');
  b.hidden = !GIT.actif;
  if (!GIT.actif) return;
  const n = (GIT.fichiers || []).length, attente = n || GIT.avance;
  b.disabled = !attente;
  b.classList.toggle('s', !attente);
  b.textContent = attente ? 'Publier en ligne ↑' : 'Tout est en ligne';
  b.title = n ? (n > 1 ? n + ' modifications à publier' : '1 modification à publier')
              : (GIT.avance ? 'Publication en attente d’envoi' : '');
}

async function publierEnLigne(){
  const n = (GIT.fichiers || []).length;
  const quoi = n ? (n > 1 ? n + ' modifications' : '1 modification') : 'les changements en attente';
  if (!confirm('Mettre ' + quoi + ' en ligne sur le site ?\n\n'
             + 'Le site public sera à jour dans quelques minutes.')) return;
  const b = $('#publier');
  b.disabled = true;
  etat('Publication en cours…');
  try {
    const r = await fetch(api('publier'), ecriture({ body:'{}' }));
    const j = await r.json();
    if (!r.ok || j.erreur) throw new Error(j.erreur || ('erreur ' + r.status));
    etat(j.message, 'ok');
  } catch (e) {
    etat('Publication impossible', 'ko');
    alert('La publication a échoué.\n\n' + e.message);
  }
  majGit();
}
$('#publier').addEventListener('click', publierEnLigne);

/* ================= choisir / envoyer une photo ================= */
function ouvrirChoix(titre, surChoix){
  const corps = $('#choixCorps');
  corps.innerHTML = '';
  const sections = [];
  if (LIB.accueil.length) sections.push(["Photos envoyées pour l'accueil", LIB.accueil]);
  D.evenements.forEach(e => {
    const l = [...new Set([].concat(e.cover ? [e.cover] : []).concat(e.photos.map(p => p.src)))];
    if (l.length) sections.push([e.titre || 'Sans titre', l]);
  });
  if (LIB.web.length) sections.push(["Photos d'origine du site", LIB.web]);
  sections.forEach(([nom, srcs]) => {
    corps.appendChild(el('div', { class:'grp', text:nom }));
    const g = el('div', { class:'g' });
    srcs.forEach(src => g.appendChild(el('button', { title:nomFichier(src),
      onclick: () => { fermerChoix(); surChoix(src); } }, el('img', { src:srcPhoto(src), loading:'lazy' }))));
    corps.appendChild(g);
  });
  if (!sections.length) corps.appendChild(el('p', { class:'sous', text:'Aucune photo disponible pour l\'instant.' }));
  $('#choixTitre').textContent = titre;
  $('#choix').hidden = false;
}
const fermerChoix = () => { $('#choix').hidden = true; };
$('#choixFermer').addEventListener('click', fermerChoix);
$('#choix').addEventListener('click', e => { if (e.target === $('#choix')) fermerChoix(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') fermerChoix(); });

async function envoyer(fichiers, dest, apres){
  let faites = 0;
  for (let i = 0; i < fichiers.length; i++){
    etat('Envoi ' + (i+1) + ' sur ' + fichiers.length + '…');
    try {
      const q = dest.dossier ? 'dossier=' + dest.dossier : 'evt=' + encodeURIComponent(dest.evt);
      const r = await fetch(api('upload', q + '&name=' + encodeURIComponent(fichiers[i].name)),
        ecriture({ body: fichiers[i] }));
      const j = await r.json();
      if (j.erreur) throw new Error(j.erreur);
      apres(j.src, j.largeur, j.hauteur);
      faites++;
    } catch (e) { alert('« ' + fichiers[i].name + ' » n\'a pas pu être envoyée : ' + e.message); }
  }
  etat(faites + ' photo(s) ajoutée(s)', 'ok');
  try { LIB = await (await fetch(api('images'))).json(); } catch (e) {}
  maj();
}
function boutonEnvoi(libelle, dest, apres, style){
  const inp = el('input', { type:'file', multiple:true, accept:'image/*', style:'display:none' });
  inp.addEventListener('change', () => { const f = [...inp.files]; inp.value=''; envoyer(f, dest, apres); });
  return el('span', {}, inp, el('button', { class:'b ' + (style||''), text:libelle, onclick:() => inp.click() }));
}
function zoneDepot(dest, apres, texte){
  const z = el('div', { class:'zone' },
    el('p', { text: texte || 'Glissez vos photos ici, ou :' }),
    boutonEnvoi('Choisir des photos sur mon ordinateur', dest, apres));
  ['dragenter','dragover'].forEach(ev => z.addEventListener(ev, e => { e.preventDefault(); z.classList.add('survol'); }));
  ['dragleave','drop'].forEach(ev => z.addEventListener(ev, () => z.classList.remove('survol')));
  z.addEventListener('drop', e => {
    e.preventDefault();
    const f = [...e.dataTransfer.files].filter(x => x.type.startsWith('image/'));
    if (f.length) envoyer(f, dest, apres);
  });
  return z;
}

function cartePhoto(e, p){
  const j = e.photos.indexOf(p);
  const carte = el('div', { class:'ph' },
    el('div', { class:'im', draggable:'true' },
      el('img', { src:srcPhoto(p.src), loading:'lazy' }),
      e.cover === p.src ? el('span', { class:'badge', text:'Couverture' }) : null,
      el('span', { class:'rang', text:(j+1) + '/' + e.photos.length }),
      el('div', { class:'outils' },
        el('button', { class:'b p', text:'Couverture', title:'Image de couverture',
          onclick: () => { e.cover = p.src; maj(); } }),
        el('button', { class:'b p', text:'Supprimer', onclick: () => supprimerPhoto(e, p) }))),
    el('div', { class:'bas' },
      (() => {
        const i = el('input', { type:'text', placeholder:'Légende (facultatif)' });
        i.value = p.legende || '';
        i.addEventListener('change', () => { p.legende = i.value; enregistrer(); });
        return i;
      })(),
      /* Une photo rangée dans le mauvais événement se déplace ici, sans
         la supprimer pour la renvoyer ailleurs. */
      D.evenements.length > 1 ? (() => {
        const sel = el('select');
        D.evenements.forEach(x => sel.appendChild(
          el('option', { value:x.id, text:(x.id === e.id ? '— ici —' : 'Déplacer vers : ' + x.titre) })));
        sel.value = e.id;
        sel.addEventListener('change', () => {
          const cible = evt(sel.value);
          if (!cible || cible === e) return;
          e.photos = e.photos.filter(x => x !== p);
          if (e.cover === p.src) e.cover = (e.photos[0] || {}).src || '';
          cible.photos.push(p);
          if (!cible.cover) cible.cover = p.src;
          maj();
        });
        return sel;
      })() : null));

  const im = carte.querySelector('.im');
  im.addEventListener('dragstart', ev => {
    ev.dataTransfer.setData('text/plain', String(j));
    ev.dataTransfer.effectAllowed = 'move';
    carte.classList.add('glisse');
  });
  im.addEventListener('dragend', () => carte.classList.remove('glisse'));
  carte.addEventListener('dragover', ev => {
    if (ev.dataTransfer.types.includes('Files')) return;
    ev.preventDefault(); carte.classList.add('cible');
  });
  carte.addEventListener('dragleave', () => carte.classList.remove('cible'));
  carte.addEventListener('drop', ev => {
    carte.classList.remove('cible');
    const de = parseInt(ev.dataTransfer.getData('text/plain'), 10);
    if (isNaN(de) || de === j) return;
    ev.preventDefault();
    e.photos.splice(j, 0, e.photos.splice(de, 1)[0]);
    maj();
  });
  return carte;
}

/* ================= suppressions ================= */
async function supprimerPhoto(e, p){
  if (!confirm('Supprimer cette photo ?\n\nElle part dans « image/corbeille » : rien n\'est perdu.')) return;
  try { await fetch(api('trash'), ecriture({ body: JSON.stringify({ src:p.src }) })); } catch (err) {}
  e.photos = e.photos.filter(x => x !== p);
  if (e.cover === p.src) e.cover = (e.photos[0] || {}).src || '';
  maj();
}
async function supprimerEvenement(e){
  const n = e.photos.length;
  if (!confirm('Supprimer l\'événement « ' + (e.titre || 'sans titre') + ' » ?\n\n'
    + (n ? 'Ses ' + n + ' photo(s) partent dans « image/corbeille ».' : 'Il ne contient aucune photo.'))) return;
  if (n) try {
    await fetch(api('trash'), ecriture({ body: JSON.stringify({ srcs: e.photos.map(p => p.src) }) }));
  } catch (err) {}
  D.evenements = D.evenements.filter(x => x !== e);
  vue = { type:'evts' };
  maj();
}

function dessiner(){
  [['navEvts','evts'],['navUne','une'],['navApropos','apropos'],['navPresta','presta'],
   ['navReglages','reglages'],['navLivraisons','livraisons']]
    .forEach(([id, t]) => {
      const b = $('#' + id);
      if (b) b.className = 'nav' + (vue.type === t || (t === 'evts' && vue.type === 'evt') ? ' on' : '');
    });

  const m = $('#vue');
  m.innerHTML = '';
  $('#voir').href = '/';
  if (vue.type === 'evt'){ vueEvenement(vue.id); $('#voir').href = '/#/evenement/' + vue.id; }
  else if (vue.type === 'une') vueUne();
  else if (vue.type === 'apropos'){ vueApropos(); $('#voir').href = '/#/a-propos'; }
  else if (vue.type === 'presta'){ vuePresta(); $('#voir').href = '/#/prestations'; }
  else if (vue.type === 'reglages') vueReglages();
  else if (vue.type === 'livraisons') window.afficherLivraisons(m);
  else { vueEvenements(); $('#voir').href = '/#/evenements'; }
  window.scrollTo(0, 0);
}

$('#navEvts').addEventListener('click', () => { vue = { type:'evts' }; dessiner(); });
$('#navUne').addEventListener('click', () => { vue = { type:'une' }; dessiner(); });
$('#navApropos').addEventListener('click', () => { vue = { type:'apropos' }; dessiner(); });
$('#navPresta').addEventListener('click', () => { vue = { type:'presta' }; dessiner(); });
$('#navReglages').addEventListener('click', () => { vue = { type:'reglages' }; dessiner(); });
$('#navLivraisons').addEventListener('click', () => { vue = { type:'livraisons' }; dessiner(); });

    D.evenements.forEach(e => { e.photos = e.photos || []; });

  }
})();

})();
